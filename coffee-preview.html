<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>咖啡 Lottie 预览</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.7.13/lottie.min.js"></script>
<style>
  body { margin:0; min-height:100vh; display:flex; gap:28px; align-items:center; justify-content:center; background:#7d8590; font-family:sans-serif; }
  .tile { width:190px; height:230px; border-radius:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; background:#fff; box-shadow:0 12px 32px rgba(0,0,0,.25); }
  .tile.dark { background:#1b1c22; color:#f2f2ef; }
  .anim { width:120px; height:120px; }
  .dark .anim { background:#f4f4f5; border-radius:20px; }
  p { margin:0; font-size:15px; font-weight:700; }
  span { font-size:12px; opacity:.6; }
</style></head>
<body>
  <div class="tile"><div class="anim" id="a1"></div><p>请我喝杯咖啡</p><span>浅色卡</span></div>
  <div class="tile dark"><div class="anim" id="a2"></div><p>请我喝杯咖啡</p><span>深色卡（带浅色底衬）</span></div>
  <script>
    ["a1","a2"].forEach(function(id){
      lottie.loadAnimation({ container: document.getElementById(id), renderer: "svg",
        loop: true, autoplay: true, path: "assets/lottie/coffee.json" });
    });
  </script>
</body></html>
